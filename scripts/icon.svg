<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 拼音星球应用图标源文件（由 scripts/gen-icons.mjs 栅格化）。
       设计语言与应用一致（src/styles.css 的 M4 定稿 token）：
       糖果粉星球 + 糖果黄星环 + 白色单层 ā（与 Andika 识字字形同构），
       长春花蓝天空满铺出血——iOS 自己裁圆角，这里不预裁。 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a63d8"/>
      <stop offset="1" stop-color="#7ea6f0"/>
    </linearGradient>
    <clipPath id="planetClip"><circle cx="256" cy="264" r="168"/></clipPath>
    <clipPath id="moonClip"><circle cx="414" cy="394" r="20"/></clipPath>
  </defs>

  <!-- 天空满铺（全出血背景，maskable 裁切安全） -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- 星球柔光晕 -->
  <circle cx="256" cy="264" r="198" fill="#ffffff" opacity="0.12"/>

  <!-- 星环：整环画在星球后面，露出左右侧翼即读作「有环星球」，
       不让前弧横穿字面（压过 ā 会毁掉 192px 下的可读性） -->
  <ellipse cx="256" cy="264" rx="246" ry="72" fill="none" stroke="#ffc93c"
           stroke-width="30" transform="rotate(-14 256 264)"/>

  <!-- 糖果星球：深粉打底 + 上移的亮粉圆 → 下缘自然留出弯月暗面（扁平双色） -->
  <circle cx="256" cy="264" r="168" fill="#d14c82"/>
  <g clip-path="url(#planetClip)">
    <circle cx="256" cy="238" r="168" fill="#ff6fa5"/>
  </g>

  <!-- ā：单层 a（圆碗 + 右侧竖笔，与 Andika 教学字形同构）+ 一声调号 -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <line x1="202" y1="176" x2="298" y2="176" stroke-width="26"/>
    <circle cx="250" cy="290" r="60" stroke-width="36"/>
    <line x1="310" y1="230" x2="310" y2="350" stroke-width="36"/>
  </g>

  <!-- 薄荷小卫星（扁平双色，同星球画法） -->
  <circle cx="414" cy="394" r="20" fill="#23aa71"/>
  <g clip-path="url(#moonClip)">
    <circle cx="409" cy="389" r="20" fill="#3ddc97"/>
  </g>

  <!-- 四角星光点缀（收在 maskable 中心 80% 安全区附近） -->
  <g fill="#ffffff">
    <path transform="translate(118 110) scale(1.2)"
          d="M0 -18 C 2.5 -7, 7 -2.5, 18 0 C 7 2.5, 2.5 7, 0 18 C -2.5 7, -7 2.5, -18 0 C -7 -2.5, -2.5 -7, 0 -18 Z"/>
    <path transform="translate(410 148) scale(0.9)"
          d="M0 -18 C 2.5 -7, 7 -2.5, 18 0 C 7 2.5, 2.5 7, 0 18 C -2.5 7, -7 2.5, -18 0 C -7 -2.5, -2.5 -7, 0 -18 Z"/>
    <path transform="translate(126 404) scale(0.8)"
          d="M0 -18 C 2.5 -7, 7 -2.5, 18 0 C 7 2.5, 2.5 7, 0 18 C -2.5 7, -7 2.5, -18 0 C -7 -2.5, -2.5 -7, 0 -18 Z"/>
  </g>
</svg>
